name: Verify Intelligence OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - name: Smoke test
        run: |
          npm start &
          SERVER_PID=$!
          sleep 4
          curl --fail http://localhost:3000/api/health
          kill $SERVER_PID
